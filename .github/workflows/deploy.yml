name: Deploy

# develop -> tolong-alih-uat (uat.alih.nextnovas.com)
# main    -> tolong-alih     (alih.nextnovas.com)
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (with the "Edit
# Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the wrangler config for this branch
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "file=wrangler.jsonc" >> "$GITHUB_OUTPUT"
          else
            echo "file=wrangler.uat.jsonc" >> "$GITHUB_OUTPUT"
          fi

      # Web Push keys, made here once per worker so the private half never
      # touches git or a laptop. Later runs see the secret and skip. Printed:
      # only sha256 of the drain key, which db/README.md says to put in
      # push_config — safe to show, it cannot be reversed.
      - name: VAPID keys (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFG: ${{ steps.cfg.outputs.file }}
        run: |
          if npx --yes wrangler@4 secret list -c "$CFG" | grep -q '"VAPID_PRIVATE_KEY"'; then
            echo "VAPID keys already set on this worker."
            exit 0
          fi
          node scripts/vapid.mjs > "$RUNNER_TEMP/vapid.env"
          . "$RUNNER_TEMP/vapid.env"
          printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY -c "$CFG"
          printf '%s' "$VAPID_PUBLIC_KEY"  | npx --yes wrangler@4 secret put VAPID_PUBLIC_KEY -c "$CFG"
          node -e 'const c=require("crypto"),h=(s)=>c.createHash("sha256").update(s).digest("hex");
            console.log("push_config.key_hash = " + h(h("tolong-alih push:" + process.argv[1])))' "$VAPID_PRIVATE_KEY"
          rm -f "$RUNNER_TEMP/vapid.env"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c ${{ steps.cfg.outputs.file }}
